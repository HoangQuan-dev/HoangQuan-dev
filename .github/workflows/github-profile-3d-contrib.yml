name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Move to Custom Folder
        run: |
          mkdir -p assets/contributions
          if [ -d "profile-3d-contrib" ]; then
            mv profile-3d-contrib/* assets/contributions/ 2>/dev/null || true
            rm -rf profile-3d-contrib
          fi
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Update 3D contribution graph"; then
            git push
          fi

